name: Build JUCE VST3

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Clone JUCE
        run: |
          git clone --depth 1 https://github.com C:\JUCE

      - name: Create CMakeLists.txt
        run: |
          @"
          cmake_minimum_required(VERSION 3.22)
          project(DarkTrapGen VERSION 1.0.0)
          add_subdirectory(C:/JUCE JUCE)

          juce_add_plugin(DarkTrapGen
              COMPANY_NAME "CustomAudio"
              IS_SYNTH TRUE
              NEEDS_MIDI_INPUT TRUE
              NEEDS_MIDI_OUTPUT TRUE
              IS_MIDI_EFFECT FALSE
              EDITOR_WANTS_KEYBOARD_FOCUS FALSE
              COPY_PLUGIN_AFTER_BUILD FALSE
              PLUGIN_MANUFACTURER_CODE Manu
              PLUGIN_CODE Dtrg
              FORMATS VST3
              PRODUCT_NAME "DarkTrapGen")

          juce_generate_juce_header(DarkTrapGen)

          file(GLOB SOURCES "Source/*.cpp" "Source/*.h")
          target_sources(DarkTrapGen PRIVATE `${SOURCES})

          target_compile_definitions(DarkTrapGen PUBLIC
              JUCE_WEB_BROWSER=0
              JUCE_USE_CURL=0
              JUCE_VST3_CAN_REPLACE_VST2=0)

          target_link_libraries(DarkTrapGen PRIVATE
              juce::juce_audio_utils
              juce::juce_dsp
              juce::juce_gui_extra
              PUBLIC
              juce::juce_recommended_config_flags
              juce::juce_recommended_lto_flags
              juce::juce_recommended_warning_flags)
          "@ | Out-File -FilePath "CMakeLists.txt" -Encoding utf8

      - name: Build VST3 Plugin
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release --parallel

      - name: Upload Compiled VST3
        uses: actions/upload-artifact@v4
        with:
          name: DarkTrapGen-VST3
          path: build\DarkTrapGen_artefacts\Release\VST3\**
