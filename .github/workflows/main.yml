name: Build JUCE VST3

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Clone JUCE
        run: |
          git clone --depth 1 https://github.com C:\JUCE

      - name: Build Projucer
        run: |
          msbuild "C:\JUCE\extras\Projucer\Builds\VisualStudio2022\Projucer.sln" /p:Configuration=Release /p:Platform=x64

      - name: Generate Visual Studio Project
        run: |
          & "C:\JUCE\extras\Projucer\Builds\VisualStudio2022\x64\Release\App\Projucer.exe" --resave "NewProject.jucer"

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build VST3 Plugin
        run: |
          $sln = Get-ChildItem -Path "Builds" -Filter "*.sln" -Recurse | Select-Object -First 1
          msbuild $sln.FullName /p:Configuration=Release /p:Platform=x64

      - name: Upload Compiled VST3
        uses: actions/upload-artifact@v4
        with:
          name: DarkTrapGen-VST3
          path: Builds\**\x64\Release\VST3\**
